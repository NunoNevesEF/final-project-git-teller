spring.application.name=gitteller

#Environment Variables Files
spring.config.import=optional:file:./env.properties,optional:file:./backend/env.properties
spring.jpa.hibernate.ddl-auto=update

app.repository.mode=jpa

#spring.autoconfigure.exclude=\
#org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
#org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration

#spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration

#logging.level.com.zaxxer.hikari=DEBUG
#logging.level.org.springframework.jdbc=DEBUG

server.servlet.session.persistent=false

#Google OAuth
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Github OAuth
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email,repo
spring.security.oauth2.client.provider.github.authorization-uri=https://github.com/login/oauth/authorize
spring.security.oauth2.client.provider.github.token-uri=https://github.com/login/oauth/access_token
spring.security.oauth2.client.provider.github.user-info-uri=https://api.github.com/user
spring.security.oauth2.client.provider.github.user-name-attribute=login

# Gitlab OAuth
spring.security.oauth2.client.registration.gitlab.client-id=${GITLAB_CLIENT_ID}
spring.security.oauth2.client.registration.gitlab.client-secret=${GITLAB_CLIENT_SECRET}
spring.security.oauth2.client.registration.gitlab.scope=read_user,read_repository,read_api
spring.security.oauth2.client.registration.gitlab.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.gitlab.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.gitlab.client-name=GitLab
spring.security.oauth2.client.provider.gitlab.authorization-uri=https://gitlab.com/oauth/authorize
spring.security.oauth2.client.provider.gitlab.token-uri=https://gitlab.com/oauth/token
spring.security.oauth2.client.provider.gitlab.user-info-uri=https://gitlab.com/api/v4/user
spring.security.oauth2.client.provider.gitlab.user-name-attribute=username

# JWT Configuration (3min access token expiration; 1d refresh token expiration)
app.jwt.expiration=180000
app.jwt.refresh-expiration=86400000

app.openrouter.api-key=${OPENROUTER_API_KEY}
app.openrouter.model=${OPENROUTER_MODEL:deepseek/deepseek-v4-flash}
app.openrouter.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}



logging.level.pt.isel.service=DEBUG




spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

app.frontend.redirect-url.web=${WEB_REDIRECT_URL:http://localhost:8081/login}
app.frontend.redirect-url.mobile=${MOBILE_REDIRECT_URL:http://localhost:8081/login}
